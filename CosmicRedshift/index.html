<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cosmic Redshift - Login</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 100%); color: #e0e0e0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-box { background: rgba(30, 30, 50, 0.95); padding: 50px 40px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); border: 1px solid rgba(77, 166, 255, 0.3); text-align: center; max-width: 500px; width: 100%; }
        .login-box h2 { color: #4da6ff; font-size: 2em; margin-bottom: 15px; text-shadow: 0 0 15px rgba(77, 166, 255, 0.4); }
        .login-box p { color: #b0b0b0; margin-bottom: 30px; font-size: 1.1em; }
        .login-box input { width: 100%; padding: 15px; margin-bottom: 20px; background: rgba(10, 10, 20, 0.8); border: 2px solid rgba(77, 166, 255, 0.3); border-radius: 10px; color: #e0e0e0; font-size: 1em; }
        .login-box input:focus { outline: none; border-color: #4da6ff; box-shadow: 0 0 15px rgba(77, 166, 255, 0.3); }
        .login-box button { width: 100%; padding: 15px; background: linear-gradient(135deg, #4da6ff 0%, #357abd 100%); color: white; border: none; border-radius: 10px; font-size: 1.1em; font-weight: 600; cursor: pointer; box-shadow: 0 4px 15px rgba(77, 166, 255, 0.3); transition: all 0.3s ease; }
        .login-box button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(77, 166, 255, 0.5); }
        .pw-wrap { position: relative; margin-bottom: 20px; }
        .login-box .pw-wrap input { margin-bottom: 0; padding-right: 52px; }
        .login-box .pw-toggle { position: absolute; top: 0; right: 0; height: 100%; width: 46px;
            display: flex; align-items: center; justify-content: center; padding: 0;
            background: none; border: none; box-shadow: none; border-radius: 0 10px 10px 0;
            color: #7b8ba3; cursor: pointer; transition: color 0.2s ease; }
        .login-box .pw-toggle:hover { color: #4da6ff; transform: none; box-shadow: none; }
        .login-box .pw-toggle:focus-visible { outline: 2px solid #4da6ff; outline-offset: -3px; }
        .login-box .pw-toggle svg { width: 21px; height: 21px; display: block; }
        #loginError { color: #ff6b6b; margin-top: 15px; margin-bottom: 15px; display: none; padding: 12px; background: rgba(255, 107, 107, 0.1); border-radius: 8px; text-align: left; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🌌 Cosmic Redshift</h2>
        <p>Enter your information to begin</p>
        <input type="text" id="studentName" placeholder="Student Name">
        <input type="text" id="studentID" placeholder="Student ID">
        <div class="pw-wrap">
            <input type="password" id="studentPassword" placeholder="Quiz Password">
            <button type="button" class="pw-toggle" id="pwToggle" onclick="togglePassword()"
                    aria-label="Show password" title="Show password">
                <svg id="pwIconShow" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg id="pwIconHide" style="display:none" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                    <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
            </button>
        </div>
        <div id="loginError"></div>
        <button onclick="startQuiz()">Start Quiz</button>
    </div>
    
    <script src="redshift-shared.js"></script>
    <script>
        // Best-effort: replace the field labels with the teacher's custom ones.
        window.addEventListener('load', async () => {
            const ok = await loadLoginDescriptors();
            if (!ok) return;
            const n = document.getElementById('studentName');
            const i = document.getElementById('studentID');
            const p = document.getElementById('studentPassword');
            if (n) n.placeholder = quizConfig.loginDescriptors.name || n.placeholder;
            if (i) i.placeholder = quizConfig.loginDescriptors.id   || i.placeholder;
            if (p) p.placeholder = quizConfig.loginDescriptors.pass || p.placeholder;
        });

        // Reveal/hide the quiz password. Field returns to masked on submit, so a
        // revealed password is never left on screen after login.
        function togglePassword() {
            const field = document.getElementById('studentPassword');
            const showing = field.type === 'text';
            field.type = showing ? 'password' : 'text';
            document.getElementById('pwIconShow').style.display = showing ? 'block' : 'none';
            document.getElementById('pwIconHide').style.display = showing ? 'none' : 'block';
            const btn = document.getElementById('pwToggle');
            const label = showing ? 'Show password' : 'Hide password';
            btn.setAttribute('aria-label', label);
            btn.title = label;
            field.focus();
        }

        async function startQuiz() {
            const name = document.getElementById('studentName').value.trim();
            const studentID = document.getElementById('studentID').value.trim();
            const password = document.getElementById('studentPassword').value.trim();
            const errorDiv = document.getElementById('loginError');
            
            errorDiv.style.display = 'none';

            // Set inside the db branch below; read again when writing the session doc.
            let creditClosed = false;
            let reviewMode = '';

            if (!name || !studentID || !password) { 
                errorDiv.textContent = 'Please fill in all fields.'; 
                errorDiv.style.display = 'block'; 
                return; 
            }

            // The password now lives in the database and is verified against QUIZ_ID
            // below, so there is nothing to pre-check here.

            try {
                if (db) {
                    // Verify QUIZ_ID + the typed password together. This resolves the
                    // exact class-quiz and blocks a password belonging to another quiz.
                    const resolved = await resolveQuizConfig(password);
                    if (!resolved) {
                        errorDiv.textContent = 'Incorrect password for this quiz.';
                        errorDiv.style.display = 'block';
                        return;
                    }

                    if (quizConfig.idValidation && quizConfig.idValidation.type !== 'none') {
                        const valType = quizConfig.idValidation.type;
                        const valValue = quizConfig.idValidation.value;
                        if (valType === 'digits') {
                            const numDigits = parseInt(valValue, 10);
                            const digitRegex = new RegExp(`^\\d{${numDigits}}$`);
                            if (!digitRegex.test(studentID)) {
                                errorDiv.textContent = `Invalid ID: Student ID must be exactly ${numDigits} digits long.`;
                                errorDiv.style.display = 'block';
                                return;
                            }
                        } else if (valType === 'startsWith') {
                            if (!studentID.startsWith(valValue)) {
                                errorDiv.textContent = `Invalid ID: Student ID must start with "${valValue}".`;
                                errorDiv.style.display = 'block';
                                return;
                            }
                        }
                    }

                    // Availability has THREE dates:
                    //   startDateTime      — nothing before this
                    //   stopDateTime       — graded attempts end here (the due date)
                    //   reviewStopDateTime — ungraded review ends here (blank = same as stop)
                    const now = new Date();
                    const startStr    = quizConfig.restrictions.startDateTime;
                    const stopStr     = quizConfig.restrictions.stopDateTime;
                    const hardStopStr = quizConfig.restrictions.reviewStopDateTime || stopStr;

                    if (startStr) {
                        const start = new Date(startStr);
                        if (now < start) {
                            errorDiv.textContent = `Quiz is not available yet. It will open on ${start.toLocaleDateString()} at ${start.toLocaleTimeString()}.`;
                            errorDiv.style.display = 'block';
                            return;
                        }
                    }
                    if (hardStopStr) {
                        const hardStop = new Date(hardStopStr);
                        if (now > hardStop) {
                            errorDiv.textContent = `Quiz has closed. It was available until ${hardStop.toLocaleDateString()} at ${hardStop.toLocaleTimeString()}.`;
                            errorDiv.style.display = 'block';
                            return;
                        }
                    }
                    // Past the due date but still inside the review window: the quiz opens,
                    // but nothing is graded — unused attempts are forfeit once credit closes.
                    creditClosed = !!(stopStr && now > new Date(stopStr));

                    // Attempt limits / review decision. Two ways into an ungraded review:
                    //   1. attempts are used up
                    //   2. the credit window has closed
                    // Neither locks the student out while the review window is open.
                    const maxAttempts = parseInt(quizConfig.restrictions.attemptsAllowed, 10) || 0;
                    reviewMode = creditClosed ? 'closed' : '';

                    if (maxAttempts > 0) {
                        const snap = await db.collection('students')
                                             .where('studentID', '==', studentID)
                                             .where('databaseId', '==', quizConfig.databaseId)
                                             .get();
                        // Review sessions are NOT attempts and must never inflate the count.
                        const priorAttempts = snap.docs.filter(d => d.data().review !== true).length;
                        if (priorAttempts >= maxAttempts) reviewMode = reviewMode || 'attempts';

                        sessionStorage.setItem('attemptNumber', (reviewMode ? priorAttempts : priorAttempts + 1).toString());
                        sessionStorage.setItem('maxAttempts', maxAttempts.toString());
                    } else {
                        sessionStorage.setItem('attemptNumber', '1');
                        sessionStorage.setItem('maxAttempts', '0');
                    }
                } else {
                    // Standalone mode (no Firebase, e.g. a local preview) — ungraded.
                    sessionStorage.setItem('attemptNumber', '1');
                    sessionStorage.setItem('maxAttempts', '0');
                }

                // Read by updateBanner() and outro.html: '' | 'attempts' | 'closed'
                sessionStorage.setItem('reviewMode', reviewMode);
                sessionStorage.setItem('creditCloseLabel',
                    creditClosed && quizConfig.restrictions.stopDateTime
                        ? new Date(quizConfig.restrictions.stopDateTime).toLocaleString() : '');

                const sessionId = Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                sessionStorage.setItem('studentName', name);
                sessionStorage.setItem('studentID', studentID);
                sessionStorage.setItem('sessionId', sessionId);
                sessionStorage.setItem('quizConfig', JSON.stringify(quizConfig));
                sessionStorage.setItem('answers', '{}');
                sessionStorage.setItem('score', '0');
                
                if (quizConfig.restrictions.timeLimit > 0) {
                    const nowMs = Date.now();
                    sessionStorage.setItem('quizStartTime', nowMs.toString());
                    sessionStorage.setItem('timerEndTime', (nowMs + quizConfig.restrictions.timeLimit * 60000).toString());
                }
                
                if (db) {
                    await db.collection('students').doc(sessionId).set({
                        name, 
                        studentID,
                        className: quizConfig.className || 'cosmic-redshift',
                        quizName: quizConfig.quizName || 'cosmic-redshift',
                        quizPassword: password,
                        databaseId: quizConfig.databaseId || 'standalone',
                        startTime: firebase.firestore.Timestamp.now(),
                        answers: {}, 
                        score: 0, 
                        completed: false,
                        // review:true marks an ungraded study run — the dashboard reports skip these.
                        review: !!reviewMode,
                        reviewReason: reviewMode || null
                    });
                }
                
                window.location.href = 'intro.html';
                
            } catch (e) {
                errorDiv.textContent = 'Database connection error. Please notify your instructor.';
                console.error(e);
                errorDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
