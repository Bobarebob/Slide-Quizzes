<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Planetary Retrograde Motion - Login</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 100%); color: #e0e0e0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-box { background: rgba(30, 30, 50, 0.95); padding: 50px 40px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); border: 1px solid rgba(77, 166, 255, 0.3); text-align: center; max-width: 500px; width: 100%; }
        .login-box h2 { color: #4da6ff; font-size: 2em; margin-bottom: 15px; text-shadow: 0 0 15px rgba(77, 166, 255, 0.4); }
        .login-box p { color: #b0b0b0; margin-bottom: 30px; font-size: 1.1em; }
        .login-box input { width: 100%; padding: 15px; margin-bottom: 20px; background: rgba(10, 10, 20, 0.8); border: 2px solid rgba(77, 166, 255, 0.3); border-radius: 10px; color: #e0e0e0; font-size: 1em; }
        .login-box input:focus { outline: none; border-color: #4da6ff; box-shadow: 0 0 15px rgba(77, 166, 255, 0.3); }
        .login-box button { width: 100%; padding: 15px; background: linear-gradient(135deg, #4da6ff 0%, #357abd 100%); color: white; border: none; border-radius: 10px; font-size: 1.1em; font-weight: 600; cursor: pointer; box-shadow: 0 4px 15px rgba(77, 166, 255, 0.3); }
        .login-box button:hover { transform: translateY(-2px); }
        /* Show-password eye. Browsers disagree about the built-in one -- Edge
           draws it, Firefox/Waterfox normally does not -- so we hide the native
           control and supply our own, which looks and behaves the same
           everywhere. */
        #studentPassword::-ms-reveal,
        #studentPassword::-ms-clear { display: none !important; width: 0; height: 0; }
        #studentPassword::-webkit-credentials-auto-fill-button,
        #studentPassword::-webkit-strong-password-auto-fill-button,
        #studentPassword::-webkit-contacts-auto-fill-button {
            display: none !important; visibility: hidden; pointer-events: none;
            width: 0; height: 0; margin: 0;
        }
        .password-wrap { position: relative; margin-bottom: 20px; }
        .password-wrap input { margin-bottom: 0 !important; padding-right: 52px; }
        .pw-toggle {
            position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
            width: 34px !important; height: 34px; padding: 0 !important;
            background: none !important; border: none !important;
            box-shadow: none !important; border-radius: 8px;
            color: #7f9bbf; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .pw-toggle:hover {
            transform: translateY(-50%) !important;
            color: #4da6ff; background: rgba(77, 166, 255, 0.12) !important;
        }
        .pw-toggle:focus-visible { outline: 2px solid #4da6ff; outline-offset: 2px; }
        .pw-toggle svg { width: 20px; height: 20px; display: block; }
        #loginError { color: #ff6b6b; margin-top: 15px; display: none; padding: 12px; background: rgba(255, 107, 107, 0.1); border-radius: 8px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🪐 Planetary Retrograde Motion</h2>
        <p>Enter your information to begin</p>
        <input type="text" id="studentName" placeholder="Loading...">
        <input type="text" id="studentID" placeholder="Loading...">
        <div class="password-wrap">
            <input type="password" id="studentPassword" placeholder="Loading..."
                   autocomplete="off" autocapitalize="off" spellcheck="false"
                   data-lpignore="true" data-1p-ignore data-bwignore>
            <button type="button" id="togglePassword" class="pw-toggle"
                    onclick="togglePasswordVisibility()"
                    aria-label="Show password" aria-pressed="false" title="Show password"></button>
        </div>
        <div id="loginError"></div>
        <button onclick="startQuiz()">Start Quiz</button>
    </div>
    <script src="retro-shared.js"></script>
    <script>
// Eye icons (outline style, inherit the button's color)
const EYE_OPEN = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
     <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>`;
const EYE_OFF = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
     <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20C5 20 1 12 1 12a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
     <line x1="1" y1="1" x2="23" y2="23"/></svg>`;

function togglePasswordVisibility() {
    const input = document.getElementById('studentPassword');
    const btn = document.getElementById('togglePassword');
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    btn.innerHTML = show ? EYE_OFF : EYE_OPEN;
    btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    btn.setAttribute('title', show ? 'Hide password' : 'Show password');
    btn.setAttribute('aria-pressed', show ? 'true' : 'false');
    input.focus();
}

window.addEventListener('load', async () => {
    document.getElementById('togglePassword').innerHTML = EYE_OPEN;

    // Sensible defaults so fields never stay on "Loading..."
    document.getElementById('studentName').placeholder = 'Enter your name';
    document.getElementById('studentID').placeholder = 'Enter your student ID';
    document.getElementById('studentPassword').placeholder = 'Enter quiz password';
    // Best-effort: replace with the teacher's custom labels if available
    const ok = await loadLoginDescriptors();
    if (ok) {
        document.getElementById('studentName').placeholder = quizConfig.loginDescriptors.name || 'Enter your name';
        document.getElementById('studentID').placeholder = quizConfig.loginDescriptors.id || 'Enter your student ID';
        document.getElementById('studentPassword').placeholder = quizConfig.loginDescriptors.pass || 'Enter quiz password';
    }
});

async function startQuiz() {
    const name = document.getElementById('studentName').value.trim();
    const studentID = document.getElementById('studentID').value.trim();
    const password = document.getElementById('studentPassword').value;
    const errorDiv = document.getElementById('loginError');
    errorDiv.style.display = 'none';
    
    if (!name || !studentID || !password) { errorDiv.textContent = 'Fill all fields'; errorDiv.style.display = 'block'; return; }

    // Verify QUIZ_ID + the typed password together. This resolves the exact
    // class-quiz and blocks a password that belongs to a different quiz.
    const resolved = await resolveQuizConfig(password);
    if (!resolved) { errorDiv.textContent = 'Incorrect password for this quiz'; errorDiv.style.display = 'block'; return; }

    // Enforce the Student ID rule set in the dashboard (Page 3), if any.
    const idv = quizConfig.idValidation;
    if (idv && idv.type && idv.type !== 'none' && idv.value) {
        let valid = true, msg = 'Student ID is not in the required format';
        if (idv.type === 'digits') {
            const n = parseInt(idv.value, 10);
            valid = new RegExp('^\\d{' + n + '}$').test(studentID);
            msg = `Student ID must be exactly ${n} digits`;
        } else if (idv.type === 'startsWith') {
            valid = studentID.startsWith(idv.value);
            msg = `Student ID must start with "${idv.value}"`;
        } else if (idv.type === 'regex') {
            try { valid = new RegExp(idv.value).test(studentID); }
            catch (e) { valid = true; } // invalid pattern -> don't block the student
            msg = 'Student ID is not in the required format';
        }
        if (!valid) { errorDiv.textContent = msg; errorDiv.style.display = 'block'; return; }
    }
    
    // Availability has THREE dates:
    //   startDateTime      — nothing before this
    //   stopDateTime       — graded attempts end here (the assignment due date)
    //   reviewStopDateTime — ungraded review ends here (blank = same as stop)
    const now = new Date();
    const startStr = quizConfig.restrictions.startDateTime;
    const stopStr = quizConfig.restrictions.stopDateTime;
    const hardStopStr = quizConfig.restrictions.reviewStopDateTime || stopStr;   // the real lock-out
    console.log('Date check:', {
        now: now.toISOString(),
        startDateTime: startStr,
        stopDateTime: stopStr,
        reviewStopDateTime: quizConfig.restrictions.reviewStopDateTime || null
    });

    if (startStr) {
        const start = new Date(startStr);
        if (now < start) {
            errorDiv.textContent = `Quiz is not available yet. It will open on ${start.toLocaleDateString()} at ${start.toLocaleTimeString()}.`;
            errorDiv.style.display = 'block';
            return;
        }
    }
    if (hardStopStr) {
        const hardStop = new Date(hardStopStr);
        if (now > hardStop) {
            errorDiv.textContent = `Quiz has closed. It was available until ${hardStop.toLocaleDateString()} at ${hardStop.toLocaleTimeString()}.`;
            errorDiv.style.display = 'block';
            return;
        }
    }
    // Past the due date but still inside the review window: the quiz opens, but
    // nothing is graded — unused attempts are forfeit once credit closes.
    const creditClosed = !!(stopStr && now > new Date(stopStr));
    
    // Two ways into an ungraded review session:
    //   1. attempts are used up
    //   2. the credit window has closed
    // Neither locks the student out while the review window is open.
    const maxAttempts = parseInt(quizConfig.restrictions.attemptsAllowed, 10) || 0;
    let reviewMode = creditClosed ? 'closed' : '';

    if (maxAttempts > 0) {
        try {
            const snap = await db.collection('students')
                .where('studentID', '==', studentID)
                .where('quizPassword', '==', password)
                .get();
            // Review sessions are NOT attempts and must never inflate the count.
            const priorAttempts = snap.docs.filter(d => d.data().review !== true).length;
            if (priorAttempts >= maxAttempts) reviewMode = reviewMode || 'attempts';

            const attemptNumber = reviewMode ? priorAttempts : priorAttempts + 1;
            sessionStorage.setItem('attemptNumber', attemptNumber.toString());
            sessionStorage.setItem('maxAttempts', maxAttempts.toString());
        } catch (e) {
            // Don't hand out a free attempt if the lookup fails.
            console.error(e);
            errorDiv.textContent = 'Could not verify your attempt count. Please try again.';
            errorDiv.style.display = 'block';
            return;
        }
    } else {
        sessionStorage.setItem('attemptNumber', '1');
        sessionStorage.setItem('maxAttempts', '0');
    }

    // Read by updateBanner() in the shared script: '' | 'attempts' | 'closed'
    sessionStorage.setItem('reviewMode', reviewMode);
    sessionStorage.setItem('creditCloseLabel', creditClosed && stopStr ? new Date(stopStr).toLocaleString() : '');
    
    const sessionId = Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    sessionStorage.setItem('studentName', name);
    sessionStorage.setItem('studentID', studentID);
    sessionStorage.setItem('sessionId', sessionId);
    sessionStorage.setItem('quizConfig', JSON.stringify(quizConfig));
    sessionStorage.setItem('answers', '{}');
    sessionStorage.setItem('score', '0');
    
    if (quizConfig.restrictions.timeLimit > 0) {
        const now = Date.now();
        sessionStorage.setItem('quizStartTime', now.toString());
        sessionStorage.setItem('timerEndTime', (now + quizConfig.restrictions.timeLimit * 60000).toString());
    }
    
    try {
        await db.collection('students').doc(sessionId).set({
            name, studentID,
            className: quizConfig.className,
            quizName: quizConfig.quizName,
            quizPassword: password,
            databaseId: quizConfig.databaseId,
            startTime: firebase.firestore.Timestamp.now(),
            answers: {}, score: 0, completed: false,
            // review:true marks an ungraded study run — the dashboard reports skip these.
            review: !!reviewMode,
            reviewReason: reviewMode || null
        });
        window.location.href = 'intro.html';
    } catch (e) {
        errorDiv.textContent = 'Database error: ' + e.message;
        errorDiv.style.display = 'block';
    }
}
    </script>
</body>
</html>
