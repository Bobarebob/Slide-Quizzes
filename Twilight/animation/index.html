<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twilight Duration Animation</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Nunito:wght@300;400;600;700&display=swap');
:root{--bg:#060612;--panel:rgba(13,13,36,0.92);--border:#1a1a3a;--accent:#ff8c42;--accent2:#e84393;--text:#c8c8e0;--text-dim:#6868a0;--civil:#ff6b35;--nautical:#3a86ff;--astro:#8338ec;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Nunito','Segoe UI',sans-serif;}
html,body{height:100%;background:var(--bg);color:var(--text);overflow-x:hidden;}
#app{max-width:1600px;margin:0 auto;padding:8px 10px;}
header{font-family:'Orbitron','Courier New',monospace;font-size:1.3rem;font-weight:700;text-align:center;padding:5px 0 3px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px;}
header small{display:block;font-family:'Nunito','Segoe UI',sans-serif;font-size:.55rem;letter-spacing:4px;-webkit-text-fill-color:var(--text-dim);margin-top:1px;}
#controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;background:rgba(13,13,36,.95);border:1px solid var(--border);border-radius:8px;padding:6px 10px;margin:5px 0;}
.ctrl-group{display:flex;flex-direction:column;gap:1px;}
.ctrl-group label{font-size:.55rem;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-dim);font-weight:600;font-family:'Nunito','Segoe UI',sans-serif;}
select,button{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:5px;padding:3px 6px;font-family:'Nunito','Segoe UI',sans-serif;font-size:.75rem;cursor:pointer;transition:border-color .2s;}
select:hover,button:hover{border-color:var(--accent);}
input[type=range]{-webkit-appearance:none;width:120px;height:4px;background:var(--border);border-radius:2px;outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--bg);}
.lat-display{font-family:'Orbitron','Courier New',monospace;font-size:.75rem;color:var(--accent);min-width:34px;text-align:center;}
#info-box{font-size:.58rem;color:var(--text-dim);line-height:1.3;white-space:pre-line;max-width:170px;padding:2px 6px;border-right:1px solid var(--border);}
#info-box b{color:var(--text);}
#canvas-wrap{position:relative;width:100%;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#000;}
#sky-canvas{width:100%;display:block;}
#phase-label{position:absolute;top:8px;left:10px;font-family:'Orbitron','Courier New',monospace;font-size:.68rem;letter-spacing:1px;padding:3px 8px;border-radius:4px;background:rgba(0,0,0,.65);border:1px solid var(--border);}
#alt-label{position:absolute;top:8px;left:215px;font-family:'Orbitron','Courier New',monospace;font-size:.62rem;padding:3px 8px;border-radius:4px;background:rgba(0,0,0,.65);border:1px solid var(--border);color:var(--accent);}
#float-panels{position:absolute;top:8px;right:8px;width:235px;display:flex;flex-direction:column;gap:5px;pointer-events:none;}
#float-panels>*{pointer-events:auto;}
.fcard{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:9px;transition:opacity .35s ease;}
.fcard h3{font-family:'Orbitron','Courier New',monospace;font-size:.52rem;letter-spacing:1.5px;color:var(--text-dim);margin-bottom:5px;text-transform:uppercase;}
#elapsed-clock{font-family:'Orbitron','Courier New',monospace;font-size:1.4rem;font-weight:700;text-align:center;color:var(--accent);margin:2px 0 5px;text-shadow:0 0 16px rgba(255,140,66,.3);}
.segment-row{display:flex;justify-content:space-between;align-items:center;padding:2px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.segment-row:last-child{border-bottom:none;}
.seg-label{font-size:.62rem;display:flex;align-items:center;gap:4px;}
.seg-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.seg-time{font-family:'Orbitron','Courier New',monospace;font-size:.66rem;font-weight:600;color:var(--text-dim);}
.seg-time.filled{color:#fff;}
#azimuth-canvas{width:100%;display:block;border-radius:4px;}
#az-info{font-size:.6rem;color:var(--text-dim);margin-top:3px;line-height:1.35;}
.btn-row{display:flex;gap:4px;}
.btn-row button{flex:1;font-size:.73rem;}
#btn-fs{font-size:.65rem;padding:2px 5px;cursor:pointer;}
body.maxed{position:fixed;inset:0;margin:0;padding:10px 14px;overflow:auto;z-index:9999;background:var(--bg);}
body.maxed #canvas-wrap{margin-bottom:0;}
#btn-rec.live{border-color:#e84393;color:#e84393;}
#rec-note{font-size:.55rem;color:var(--text-dim);max-width:210px;line-height:1.3;}
@media(max-width:700px){#float-panels{position:static;width:100%;flex-direction:row;flex-wrap:wrap;margin-top:6px;}.fcard{flex:1;min-width:200px;}}
</style>
</head>
<body>
<script>
/* ===========================================================================
   fmp4ToProgressiveMp4(bytes, opts) -> Uint8Array

   MediaRecorder cannot write a normal MP4. It streams chunks out as it encodes
   and never rewinds to write a sample table, so a "video/mp4" recording is a
   fragmented MP4:

       ftyp  moov(empty stbl + mvex)  moof mdat  moof mdat ...

   Chrome and VLC play it. Camtasia reads the moov, finds no samples, and shows
   about two seconds. This walks the fragments, rebuilds a real stbl, and writes
   ftyp + moov + mdat. The H.264 bytes are copied, never re-encoded.

   opts.fps  - retime every sample to exactly 1/fps (metadata only). Worth using:
               frames stepped with requestFrame() are evenly spaced by intent, but
               MediaRecorder stamps them with wall-clock time, and Camtasia handles
               variable frame rate badly.

   Already-progressive input is returned unchanged, so it is safe to call on any
   recording. Anything it cannot parse confidently is also returned unchanged.
   =========================================================================== */
(function (root) {
  'use strict';

  var CONTAINERS = { moov:1, trak:1, mdia:1, minf:1, stbl:1, moof:1, traf:1, mvex:1, edts:1, dinf:1 };

  function u32(b, p) { return (b[p] << 24 | b[p+1] << 16 | b[p+2] << 8 | b[p+3]) >>> 0; }
  function u64(b, p) { return u32(b, p) * 4294967296 + u32(b, p + 4); }
  function type(b, p) { return String.fromCharCode(b[p], b[p+1], b[p+2], b[p+3]); }

  // Parse one level of boxes between [start, end).
  function boxes(b, start, end) {
    var out = [], p = start;
    while (p + 8 <= end) {
      var size = u32(b, p), t = type(b, p + 4), head = 8;
      if (size === 1) { size = u64(b, p + 8); head = 16; }
      else if (size === 0) { size = end - p; }
      if (size < head || p + size > end) break;
      var box = { type: t, start: p, end: p + size, body: p + head, size: size };
      if (CONTAINERS[t]) box.children = boxes(b, box.body, box.end);
      out.push(box);
      p += size;
    }
    return out;
  }
  function find(list, t) { for (var i = 0; i < list.length; i++) if (list[i].type === t) return list[i]; return null; }
  function findAll(list, t) { var r = []; for (var i = 0; i < list.length; i++) if (list[i].type === t) r.push(list[i]); return r; }
  function deep(box, path) {                      // deep(moov, 'trak/mdia/minf/stbl')
    var cur = box, parts = path.split('/');
    for (var i = 0; i < parts.length && cur; i++) cur = cur.children ? find(cur.children, parts[i]) : null;
    return cur;
  }

  /* ---------- writing ---------- */
  function box(t, parts) {
    var len = 8, i;
    for (i = 0; i < parts.length; i++) len += parts[i].length;
    var out = new Uint8Array(len);
    out[0] = len >>> 24 & 255; out[1] = len >>> 16 & 255; out[2] = len >>> 8 & 255; out[3] = len & 255;
    for (i = 0; i < 4; i++) out[4 + i] = t.charCodeAt(i);
    var p = 8;
    for (i = 0; i < parts.length; i++) { out.set(parts[i], p); p += parts[i].length; }
    return out;
  }
  function be32(n) { return new Uint8Array([n >>> 24 & 255, n >>> 16 & 255, n >>> 8 & 255, n & 255]); }
  function table(t, entries, wide) {              // version 0, flags 0, count, entries
    var per = wide ? 8 : 4, out = new Uint8Array(8 + entries.length * per), p = 8, i;
    out.set(be32(entries.length), 4);
    for (i = 0; i < entries.length; i++) {
      if (wide) { out.set(be32(entries[i][0]), p); out.set(be32(entries[i][1]), p + 4); p += 8; }
      else { out.set(be32(entries[i]), p); p += 4; }
    }
    return box(t, [out]);
  }

  /* ---------- fragment walking ---------- */
  function trexDefaults(moov, trackId) {
    var d = { dur: 0, size: 0, flags: 0 }, mvex = deep(moov, 'mvex');
    if (!mvex) return d;
    var list = findAll(mvex.children, 'trex');
    for (var i = 0; i < list.length; i++) {
      var b = list[i].raw;
      if (u32(b, list[i].body + 4) === trackId) {
        d.dur = u32(b, list[i].body + 12);
        d.size = u32(b, list[i].body + 16);
        d.flags = u32(b, list[i].body + 20);
        return d;
      }
    }
    return d;
  }

  function samplesFromFragments(b, top, moov, trackId, trex) {
    var samples = [], moofs = findAll(top, 'moof'), fi;
    for (fi = 0; fi < moofs.length; fi++) {
      var moof = moofs[fi], trafs = findAll(moof.children, 'traf');
      for (var ti = 0; ti < trafs.length; ti++) {
        var traf = trafs[ti], tfhd = find(traf.children, 'tfhd');
        if (!tfhd) continue;
        var flags = u32(b, tfhd.body) & 0xffffff, p = tfhd.body + 4;
        var id = u32(b, p); p += 4;
        if (id !== trackId) continue;
        var baseOffset = moof.start, haveBase = false;
        if (flags & 0x01) { baseOffset = u64(b, p); p += 8; haveBase = true; }
        if (flags & 0x02) p += 4;                                   // sample description index
        var defDur  = (flags & 0x08) ? u32(b, (p += 4) - 4) : trex.dur;
        var defSize = (flags & 0x10) ? u32(b, (p += 4) - 4) : trex.size;
        var defFlag = (flags & 0x20) ? u32(b, (p += 4) - 4) : trex.flags;

        var tfdt = find(traf.children, 'tfdt'), baseTime = null;
        if (tfdt) baseTime = (b[tfdt.body] === 1) ? u64(b, tfdt.body + 4) : u32(b, tfdt.body + 4);

        var truns = findAll(traf.children, 'trun'), t, clock = baseTime;
        for (t = 0; t < truns.length; t++) {
          var trun = truns[t], tf = u32(b, trun.body) & 0xffffff, q = trun.body + 4;
          var count = u32(b, q); q += 4;
          var dataOff = baseOffset;
          if (tf & 0x001) { dataOff = (haveBase ? baseOffset : moof.start) + (u32(b, q) | 0); q += 4; }
          var first = (tf & 0x004) ? u32(b, q) : 0; if (tf & 0x004) q += 4;
          var pos = dataOff;
          for (var s = 0; s < count; s++) {
            var dur  = (tf & 0x100) ? u32(b, (q += 4) - 4) : defDur;
            var size = (tf & 0x200) ? u32(b, (q += 4) - 4) : defSize;
            var fl   = (tf & 0x400) ? u32(b, (q += 4) - 4) : (s === 0 && (tf & 0x004) ? first : defFlag);
            var cts  = (tf & 0x800) ? u32(b, (q += 4) - 4) : 0;
            if (tf & 0x800 && b[trun.body] === 1) cts = cts | 0;     // signed in version 1
            samples.push({
              offset: pos, size: size, dur: dur, cts: cts,
              sync: !(fl & 0x10000), time: clock
            });
            pos += size;
            if (clock !== null) clock += dur;
          }
        }
      }
    }
    return samples;
  }

  /* ---------- moov rebuild ---------- */
  function rebuildMoov(b, moov, trak, stblParts, totalDur, movieTimescale, mediaTimescale) {
    // Re-emit the moov tree, swapping in the new stbl, dropping mvex, and fixing durations.
    function emit(node) {
      if (node.type === 'mvex') return null;
      if (node.type === 'stbl') return box('stbl', stblParts);
      if (node.type === 'mvhd' || node.type === 'tkhd' || node.type === 'mdhd') {
        // Field layout, measured from the start of the box body (version+flags included):
        //   mvhd/mdhd v0: created 4, modified 8, timescale 12, duration 16 (32-bit)
        //   mvhd/mdhd v1: created 4, modified 12, timescale 20, duration 24 (64-bit)
        //   tkhd    v0: created 4, modified 8, trackId 12, reserved 16, duration 20 (32-bit)
        //   tkhd    v1: created 4, modified 12, trackId 20, reserved 24, duration 28 (64-bit)
        // Only the duration is touched; the timescale beside it must be left alone.
        var body = b.slice(node.body, node.end), v = body[0];
        var scale = (node.type === 'mdhd') ? mediaTimescale : movieTimescale;
        var dur = Math.round(totalDur * scale);
        var off = (v === 1) ? (node.type === 'tkhd' ? 28 : 24)
                            : (node.type === 'tkhd' ? 20 : 16);
        if (v === 1) {
          if (off + 8 > body.length) return box(node.type, [body]);
          body.set(be32(Math.floor(dur / 4294967296)), off);
          body.set(be32(dur >>> 0), off + 4);
        } else {
          if (off + 4 > body.length) return box(node.type, [body]);
          body.set(be32(dur >>> 0), off);
        }
        return box(node.type, [body]);
      }
      if (node.children) {
        var parts = [];
        for (var i = 0; i < node.children.length; i++) {
          var kid = emit(node.children[i]);
          if (kid) parts.push(kid);
        }
        return box(node.type, parts);
      }
      return b.slice(node.start, node.end);
    }
    return emit(moov);
  }

  function fmp4ToProgressiveMp4(input, opts) {
    opts = opts || {};
    try {
      var b = (input instanceof Uint8Array) ? input : new Uint8Array(input);
      var top = boxes(b, 0, b.length);
      for (var i = 0; i < top.length; i++) top[i].raw = b;
      var moovBox = find(top, 'moov');
      if (!moovBox) return input;
      var moofs = findAll(top, 'moof');
      if (!moofs.length) return input;                      // already progressive

      var traks = findAll(moovBox.children, 'trak');
      if (traks.length !== 1) return input;                 // only the single-video case
      var trak = traks[0];
      var tkhd = deep(trak, 'tkhd'); if (!tkhd) return input;
      var trackId = (b[tkhd.body] === 1) ? u32(b, tkhd.body + 20) : u32(b, tkhd.body + 12);
      var mdhd = deep(trak, 'mdia/mdhd'); if (!mdhd) return input;
      var mediaTimescale = (b[mdhd.body] === 1) ? u32(b, mdhd.body + 20) : u32(b, mdhd.body + 12);
      var mvhd = find(moovBox.children, 'mvhd'); if (!mvhd) return input;
      var movieTimescale = (b[mvhd.body] === 1) ? u32(b, mvhd.body + 20) : u32(b, mvhd.body + 12);
      var stbl = deep(trak, 'mdia/minf/stbl'); if (!stbl) return input;

      // annotate mvex children with raw for trexDefaults
      var mvex = find(moovBox.children, 'mvex');
      if (mvex) for (var k = 0; k < mvex.children.length; k++) mvex.children[k].raw = b;

      var samples = samplesFromFragments(b, top, moovBox, trackId, trexDefaults(moovBox, trackId));
      if (samples.length < 2) return input;

      // ---- sample data, copied byte for byte
      var total = 0, s;
      for (s = 0; s < samples.length; s++) total += samples[s].size;
      var mdatBody = new Uint8Array(total), w = 0;
      for (s = 0; s < samples.length; s++) {
        if (samples[s].offset + samples[s].size > b.length) return input;
        mdatBody.set(b.subarray(samples[s].offset, samples[s].offset + samples[s].size), w);
        samples[s].newOffset = w;
        w += samples[s].size;
      }

      // ---- durations: uniform when fps is given, else anchored on each fragment's tfdt
      var durs = new Array(samples.length), fixed = null;
      if (opts.fps > 0) {
        fixed = Math.round(mediaTimescale / opts.fps);
        for (s = 0; s < samples.length; s++) durs[s] = fixed;
      } else {
        for (s = 0; s < samples.length; s++) {
          var next = (s + 1 < samples.length) ? samples[s + 1].time : null;
          durs[s] = (samples[s].time !== null && next !== null && next > samples[s].time)
            ? (next - samples[s].time) : samples[s].dur;
          if (!durs[s]) durs[s] = samples[s].dur || Math.round(mediaTimescale / 30);
        }
      }
      var ticks = 0;
      for (s = 0; s < samples.length; s++) ticks += durs[s];

      // ---- stts (run-length), stsz, stsc, stco, stss, ctts
      var stts = [], run = null;
      for (s = 0; s < samples.length; s++) {
        if (run && run[1] === durs[s]) run[0]++;
        else { run = [1, durs[s]]; stts.push(run); }
      }
      var sizes = [], sync = [], ctts = [], cRun = null, needCtts = false;
      for (s = 0; s < samples.length; s++) {
        sizes.push(samples[s].size);
        if (samples[s].sync) sync.push(s + 1);
        var off = opts.fps > 0 ? 0 : samples[s].cts;
        if (off) needCtts = true;
        if (cRun && cRun[1] === off) cRun[0]++;
        else { cRun = [1, off]; ctts.push(cRun); }
      }

      var mdatHeader = 8;
      var stblParts = [];
      var stsd = find(stbl.children, 'stsd');
      if (!stsd) return input;
      stblParts.push(b.slice(stsd.start, stsd.end));
      stblParts.push(table('stts', stts, true));
      if (needCtts) stblParts.push(table('ctts', ctts, true));
      if (sync.length && sync.length !== samples.length) stblParts.push(table('stss', sync, false));
      var stszBody = new Uint8Array(12 + sizes.length * 4);
      stszBody.set(be32(0), 4); stszBody.set(be32(sizes.length), 8);
      for (s = 0; s < sizes.length; s++) stszBody.set(be32(sizes[s]), 12 + s * 4);
      stblParts.push(box('stsz', [stszBody]));
      var stscBody = new Uint8Array(8 + 12);
      stscBody.set(be32(1), 4);
      stscBody.set(be32(1), 8); stscBody.set(be32(samples.length), 12); stscBody.set(be32(1), 16);
      stblParts.push(box('stsc', [stscBody]));
      var stcoBody = new Uint8Array(8 + 4);
      stcoBody.set(be32(1), 4);
      stblParts.push(box('stco', [stcoBody]));              // patched once the moov size is known

      var seconds = ticks / mediaTimescale;
      var ftyp = find(top, 'ftyp');
      var ftypBytes = ftyp ? b.slice(ftyp.start, ftyp.end)
                           : box('ftyp', [new Uint8Array([0x69,0x73,0x6f,0x6d,0,0,2,0,0x69,0x73,0x6f,0x6d,0x69,0x73,0x6f,0x32,0x61,0x76,0x63,0x31,0x6d,0x70,0x34,0x31])]);
      var moovBytes = rebuildMoov(b, moovBox, trak, stblParts, seconds, movieTimescale, mediaTimescale);

      // chunk offset = everything before the mdat payload
      var dataStart = ftypBytes.length + moovBytes.length + mdatHeader;
      // find the stco we just wrote inside moovBytes and patch its single entry
      var moovTop = boxes(moovBytes, 0, moovBytes.length);
      moovTop[0].raw = moovBytes;
      var newStbl = deep(moovTop[0], 'trak/mdia/minf/stbl');
      var newStco = newStbl && find(newStbl.children, 'stco');
      if (!newStco) return input;
      moovBytes.set(be32(dataStart), newStco.body + 8);

      var mdatHead = new Uint8Array(8);
      var mdatSize = mdatHeader + mdatBody.length;
      mdatHead.set(be32(mdatSize), 0);
      mdatHead[4] = 109; mdatHead[5] = 100; mdatHead[6] = 97; mdatHead[7] = 116;   // 'mdat'

      var out = new Uint8Array(ftypBytes.length + moovBytes.length + mdatSize), p = 0;
      out.set(ftypBytes, p); p += ftypBytes.length;
      out.set(moovBytes, p); p += moovBytes.length;
      out.set(mdatHead, p); p += 8;
      out.set(mdatBody, p);
      return out;
    } catch (e) {
      return input;                                          // never lose a recording to this
    }
  }

  root.fmp4ToProgressiveMp4 = fmp4ToProgressiveMp4;
  if (typeof module !== 'undefined' && module.exports) module.exports = { fmp4ToProgressiveMp4: fmp4ToProgressiveMp4 };
})(typeof window !== 'undefined' ? window : this);
</script>
<div id="app">
<header>Twilight Duration<small>Evening Twilight · Equinoxes &amp; Solstices · Northern Hemisphere</small></header>
<div id="controls">
  <div class="ctrl-group"><label>&nbsp;</label><button id="btn-fs" title="Toggle Fullscreen">⛶ Full</button></div>
  <div id="info-box"></div>
  <div class="ctrl-group"><label>Year</label><select id="sel-year"></select></div>
  <div class="ctrl-group"><label>Day</label>
    <select id="sel-day"><option value="vernal">Vernal Equinox</option><option value="summer">Summer Solstice</option><option value="autumnal">Autumnal Equinox</option><option value="winter">Winter Solstice</option></select>
  </div>
  <div class="ctrl-group"><label>Latitude</label>
    <div style="display:flex;align-items:center;gap:5px;"><input type="range" id="sl-lat" min="0" max="70" value="35" step="1"><span class="lat-display" id="lat-display">35°N</span></div>
  </div>
  <div class="ctrl-group"><label>Speed</label>
    <select id="sel-speed"><option value="30">30×</option><option value="60">60×</option><option value="120">120×</option><option value="240">240×</option><option value="480" selected>480×</option></select>
  </div>
  <div class="ctrl-group"><label>&nbsp;</label>
    <div class="btn-row"><button id="btn-play">▶ Play</button><button id="btn-restart">⟳ Reset</button></div>
  </div>
  <div class="ctrl-group"><label>Location</label><select id="loc-sel"></select></div>
  <div class="ctrl-group"><label>Viewpoint</label><select id="vp-sel"><option value="W" selected>W</option><option value="NW">NW</option><option value="SW">SW</option></select></div>
  <div class="ctrl-group"><label>Record</label>
    <div class="btn-row"><button id="btn-rec">⏺ Record</button><button id="btn-fmt">Format: —</button></div>
  </div>
  <div class="ctrl-group"><label>Length</label>
    <select id="sel-dur"><option value="10">10 s</option><option value="20" selected>20 s</option><option value="30">30 s</option><option value="45">45 s</option><option value="60">60 s</option><option value="90">90 s</option></select>
  </div>
  <div class="ctrl-group"><label>FPS</label>
    <select id="sel-fps"><option value="30" selected>30</option><option value="60">60</option></select>
  </div>
  <div id="rec-note"></div>
</div>
<div id="canvas-wrap">
  <canvas id="sky-canvas"></canvas>
  <div id="phase-label">DAYLIGHT</div>
  <div id="alt-label">+6.0°</div>
  <div id="float-panels">
    <div class="fcard" id="card-timer">
      <h3 id="timer-title">Elapsed Time Since Sunset</h3>
      <div id="elapsed-clock">00:00</div>
      <div class="segment-row"><span class="seg-label"><span class="seg-dot" style="background:var(--civil)"></span>Civil (0°→−6°)</span><span class="seg-time" id="t-civil">──:──</span></div>
      <div class="segment-row"><span class="seg-label"><span class="seg-dot" style="background:var(--nautical)"></span>Nautical (−6°→−12°)</span><span class="seg-time" id="t-nautical">──:──</span></div>
      <div class="segment-row"><span class="seg-label"><span class="seg-dot" style="background:var(--astro)"></span>Astro (−12°→−18°)</span><span class="seg-time" id="t-astro">──:──</span></div>
      <div class="segment-row" style="border-top:1px solid var(--border);margin-top:2px;padding-top:4px;"><span class="seg-label" style="font-weight:700;">Total (0°→−18°)</span><span class="seg-time" id="t-total" style="color:var(--accent);">──:──</span></div>
    </div>
    <div class="fcard" id="card-azimuth">
      <h3>Sunset Azimuth Diagram</h3>
      <canvas id="azimuth-canvas" width="215" height="165"></canvas>
      <div id="az-info"></div>
    </div>
  </div>
</div>
</div>

<script>
const D=Math.PI/180,RD=180/Math.PI;
const DECL={vernal:0,summer:23.44,autumnal:0,winter:-23.44};
const DOY={vernal:79,summer:172,autumnal:266,winter:355};
const DL={vernal:'Vernal Equinox',summer:'Summer Solstice',autumnal:'Autumnal Equinox',winter:'Winter Solstice'};
const DSH={vernal:'VE',summer:'SS',autumnal:'AE',winter:'WS'};
const DI={vernal:0,summer:1,autumnal:2,winter:3};
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const EU={
  2026:{vernal:[2,20,14,46],summer:[5,21,8,25],autumnal:[8,23,0,6],winter:[11,21,20,50]},
  2027:{vernal:[2,20,20,25],summer:[5,21,14,11],autumnal:[8,23,6,2],winter:[11,22,2,43]},
  2028:{vernal:[2,20,2,17],summer:[5,20,20,2],autumnal:[8,22,11,45],winter:[11,21,8,20]},
  2029:{vernal:[2,20,8,1],summer:[5,21,1,48],autumnal:[8,22,17,37],winter:[11,21,14,14]},
  2030:{vernal:[2,20,13,51],summer:[5,21,7,31],autumnal:[8,22,23,27],winter:[11,21,20,9]},
};
const CITIES=[
  {id:'none',name:'None',lat:null,lon:null,tz:[0,0,0,0]},
  {id:'default',name:'Default',lat:35,lon:null,tz:[0,0,0,0]},
  {id:'chicago',name:'Chicago',lat:41.88,lon:-87.63,tz:[-5,-5,-5,-6]},
  {id:'london',name:'London',lat:51.51,lon:-0.13,tz:[0,1,1,0]},
  {id:'paris',name:'Paris',lat:48.86,lon:2.35,tz:[1,2,2,1]},
  {id:'montreal',name:'Montreal',lat:45.50,lon:-73.57,tz:[-4,-4,-4,-5]},
  {id:'fortyukon',name:'Fort Yukon',lat:66.57,lon:-145.27,tz:[-8,-8,-8,-9]},
  {id:'honolulu',name:'Honolulu',lat:21.31,lon:-157.86,tz:[-10,-10,-10,-10]},
  {id:'tokyo',name:'Tokyo',lat:35.68,lon:139.69,tz:[9,9,9,9]},
];
function fLon(l){if(l===null)return'';return Math.abs(l).toFixed(1)+(l<0?'°W':'°E');}
function locDate(yr,dk,c){const e=EU[yr][dk],o=c.tz[DI[dk]];const d=new Date(Date.UTC(yr,e[0],e[1],e[2],e[3]));d.setUTCMinutes(d.getUTCMinutes()+o*60);return MN[d.getUTCMonth()]+' '+d.getUTCDate();}

const VP={
  'W' :{az0:215,az1:325,dirs:[[225,'SW'],[247.5,'WSW'],[270,'W'],[292.5,'WNW'],[315,'NW']]},
  'NW':{az0:258,az1:368,dirs:[[270,'W'],[292.5,'WNW'],[315,'NW'],[337.5,'NNW'],[360,'N']]},
  'SW':{az0:168,az1:278,dirs:[[180,'S'],[202.5,'SSW'],[225,'SW'],[247.5,'WSW'],[270,'W']]},
};

// Solar math
function ovf(doy){return 1+2*0.0167086*Math.cos((doy-3)/365.25*2*Math.PI);}
function sAlt(lR,dR,hR){return Math.asin(Math.sin(lR)*Math.sin(dR)+Math.cos(lR)*Math.cos(dR)*Math.cos(hR));}
function sAz(lR,dR,hR){const a=sAlt(lR,dR,hR),ca=Math.cos(a);if(ca<1e-10)return Math.PI;let c2=(Math.sin(dR)-Math.sin(lR)*Math.sin(a))/(Math.cos(lR)*ca);c2=Math.max(-1,Math.min(1,c2));let az=Math.acos(c2);if(hR>0)az=2*Math.PI-az;return az;}
function haAt(lR,dR,aD){const c2=(Math.sin(aD*D)-Math.sin(lR)*Math.sin(dR))/(Math.cos(lR)*Math.cos(dR));return(c2<-1||c2>1)?null:Math.acos(c2);}
function mkPath(latD,decD){
  const lR=latD*D,dR=decD*D;
  let h6=haAt(lR,dR,6);if(!h6)h6=haAt(lR,dR,2);if(!h6)h6=haAt(lR,dR,0);
  if(!h6){
    // Sun never rises — compute below-horizon path from just past transit to near due N
    const p=[];
    for(let i=0;i<=500;i++){
      const ha=0.01+(Math.PI+0.02-0.01)*i/500;
      p.push({ha,alt:sAlt(lR,dR,ha)*RD,az:sAz(lR,dR,ha)*RD});
    }
    return p;
  }
  let hE=haAt(lR,dR,-20);if(!hE)hE=Math.PI+0.02; // extend ~1° past due N
  const p=[];for(let i=0;i<=500;i++){const ha=h6+(hE-h6)*i/500;p.push({ha,alt:sAlt(lR,dR,ha)*RD,az:sAz(lR,dR,ha)*RD});}return p;
}
function t2alt(latD,decD,aD,dk){const lR=latD*D,dR=decD*D;const h0=haAt(lR,dR,0),ht=haAt(lR,dR,aD);if(!h0||!ht)return null;return(ht-h0)*RD/(15/ovf(DOY[dk]))*60;}
function sunsetAzD(latD,decD){const lR=latD*D,dR=decD*D;const ha=haAt(lR,dR,0);return ha?sAz(lR,dR,ha)*RD:null;}
function pathAngle(latD,decD){const lR=latD*D,dR=decD*D;const ha1=haAt(lR,dR,1),ha3=haAt(lR,dR,3);if(!ha1||!ha3)return null;const az1=sAz(lR,dR,ha1)*RD,az3=sAz(lR,dR,ha3)*RD;return Math.atan2(Math.abs(az1-az3),2)*RD;}
// Does sun rise? (max altitude > 0)
function sunRises(latD,decD){return(90-Math.abs(latD-decD))>0;}

const STARS=[];for(let i=0;i<300;i++)STARS.push({x:Math.random(),y:Math.random()*.85,sz:Math.random()*1.4+.3,br:Math.random()*.6+.4,tw:Math.random()*Math.PI*2});
function genSil(w){const p=[];let x=0;while(x<=w){let r=Math.sin(x*.02)*4+Math.sin(x*.007)*6+Math.sin(x*.05)*2;let h=Math.max(2,r+8);if(Math.sin(x*.15+1)>.85)h+=12+Math.random()*10;else if(Math.sin(x*.08+3)>.7)h+=6+Math.random()*5;p.push({x,h});x+=3;}return p;}

function lerp(a,b,t){t=Math.max(0,Math.min(1,t));return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function rgb(c){return`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;}
function skyCols(a){
  if(a>4)return{z:[70,130,200],m:[120,170,220],h:[255,200,100],g:[255,180,60]};
  if(a>0){const t=(4-a)/4;return{z:lerp([70,130,200],[30,50,110],t),m:lerp([120,170,220],[80,80,140],t),h:lerp([255,200,100],[255,100,40],t),g:lerp([255,180,60],[255,80,20],t)};}
  if(a>-6){const t=-a/6;return{z:lerp([30,50,110],[10,15,45],t),m:lerp([80,80,140],[20,25,60],t),h:lerp([255,100,40],[80,40,30],t),g:lerp([255,80,20],[100,40,20],t*.8)};}
  if(a>-12){const t=(-a-6)/6;return{z:lerp([10,15,45],[5,5,18],t),m:lerp([20,25,60],[8,8,25],t),h:lerp([80,40,30],[15,12,20],t),g:lerp([100,40,20],[20,10,15],t)};}
  if(a>-18){const t=(-a-12)/6;return{z:lerp([5,5,18],[2,2,8],t),m:lerp([8,8,25],[3,3,10],t),h:lerp([15,12,20],[3,3,8],t),g:lerp([20,10,15],[5,3,5],t)};}
  return{z:[2,2,6],m:[2,2,8],h:[3,3,8],g:[3,3,6]};
}

const skyC=document.getElementById('sky-canvas'),ctx=skyC.getContext('2d');
let W,H,HY,sil;
let AZ0=215,AZ1=325,AZR=110;
const AL0=12,ALR=32;
function pX(az){return(az-AZ0)/AZR*W;}
function pY(al){return(AL0-al)/ALR*H;}

function resize(){
  const wr=document.getElementById('canvas-wrap');
  const big=!!(document.fullscreenElement||document.body.classList.contains('maxed'));
  W=wr.clientWidth;H=Math.max(360,Math.min(big?2000:680,window.innerHeight-145));
  skyC.width=W;skyC.height=H;HY=pY(0);sil=genSil(W);
  positionAzCard();
  drawFrame(performance.now());
}

function positionAzCard(){
  // Position azimuth card so top is at -3° vertical and bottom at -19° vertical
  const card=document.getElementById('card-azimuth');
  const topY=pY(-3);
  const botY=pY(-19);
  const cardH=botY-topY;
  card.style.position='absolute';
  card.style.top=topY+'px';
  card.style.right='8px';
  card.style.width='235px';
  card.style.height=cardH+'px';
  card.style.overflow='hidden';
  // Resize the azimuth canvas to fit
  const azCanvas=document.getElementById('azimuth-canvas');
  const infoH=30; // approx space for az-info text
  const titleH=20; // approx space for h3
  const pad=18; // card padding
  const availH=cardH-titleH-infoH-pad;
  if(availH>60){azCanvas.height=availH;azCanvas.width=Math.round(availH*1.3);}
}

let abTime=0,abAngle=null,abPos=null,abDir=null,prevAV=99;
const PC={vernal:{d:'rgba(255,255,100,0.15)',b:'rgba(255,255,100,0.75)'},
  summer:{d:'rgba(255,100,100,0.15)',b:'rgba(255,100,100,0.75)'},
  autumnal:{d:'rgba(100,255,100,0.15)',b:'rgba(100,255,100,0.75)'},
  winter:{d:'rgba(100,150,255,0.15)',b:'rgba(100,150,255,0.75)'}};

function cpHitsBox(aP,dk){
  const p=aP[dk];if(!p)return false;
  const boxL=W-250,boxT=0,boxB=H;
  for(const pt of p){const x=pX(pt.az),y=pY(pt.alt);if(x>=boxL&&y>=0)return true;}
  return false;
}

function drawSky(sunAlt,sunAz,aP,sel,ts){
  ctx.clearRect(0,0,W,H);
  const c=skyCols(sunAlt);
  const g=ctx.createLinearGradient(0,0,0,HY);
  g.addColorStop(0,rgb(c.z));g.addColorStop(.5,rgb(c.m));g.addColorStop(.85,rgb(c.h));g.addColorStop(1,rgb(c.g));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,HY);
  const sx=pX(sunAz);
  const gg=ctx.createRadialGradient(sx,HY,0,sx,HY,300);
  const ga=Math.max(0,Math.min(.5,(sunAlt+8)/14));
  gg.addColorStop(0,`rgba(${c.g[0]|0},${c.g[1]|0},${c.g[2]|0},${ga})`);gg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=gg;ctx.fillRect(0,0,W,HY+50);
  const sa=Math.max(0,Math.min(1,(-sunAlt-3)/12));
  if(sa>0)for(const s of STARS){const tw=.7+.3*Math.sin(ts*.002+s.tw);ctx.fillStyle=`rgba(220,220,255,${sa*s.br*tw})`;ctx.beginPath();ctx.arc(s.x*W,s.y*HY,s.sz,0,Math.PI*2);ctx.fill();}
  const bg=ctx.createLinearGradient(0,HY,0,H);const dk2=Math.max(0,Math.min(1,(-sunAlt+2)/20));
  bg.addColorStop(0,`rgba(8,18,12,${.7+dk2*.3})`);bg.addColorStop(1,'rgba(2,4,3,1)');
  ctx.fillStyle=bg;ctx.fillRect(0,HY,W,H-HY);
  if(sunAlt>-10){const bh=ctx.createRadialGradient(sx,HY,0,sx,HY+140,240);const ba=Math.max(0,(sunAlt+10)/16*.15);bh.addColorStop(0,`rgba(${c.g[0]|0},${c.g[1]|0},${c.g[2]|0},${ba})`);bh.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=bh;ctx.fillRect(0,HY,W,H-HY);}

  // Ref lines
  const rl=[{a:0,l:'Horizon (0°)',c:'rgba(255,255,255,0.4)',d:[]},{a:-6,l:'Civil −6° Vertical',c:'rgba(255,107,53,0.5)',d:[8,4]},{a:-12,l:'Nautical −12° Vertical',c:'rgba(58,134,255,0.5)',d:[8,4]},{a:-18,l:'Astronomical −18° Vertical',c:'rgba(131,56,236,0.5)',d:[8,4]}];
  for(const r of rl){const y=pY(r.a);ctx.strokeStyle=r.c;ctx.lineWidth=1;ctx.setLineDash(r.d);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();ctx.setLineDash([]);ctx.font='11px Nunito, sans-serif';ctx.fillStyle=r.c;ctx.textAlign='left';ctx.fillText(r.l,10,y-4);}

  // Draw CPs
  const eqSel=sel==='vernal'||sel==='autumnal';
  function drawCP(p,color,lw,dash){
    if(!p||p.length<2)return;
    ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.setLineDash(dash);
    ctx.beginPath();let st=false;
    for(const pt of p){const x=pX(pt.az),y=pY(pt.alt);if(x<-60||x>W+60||y<-60||y>H+60)continue;if(!st){ctx.moveTo(x,y);st=true;}else ctx.lineTo(x,y);}
    ctx.stroke();ctx.setLineDash([]);
  }

  // Find a point near 3-4° altitude on a path for labeling "in the haze"
  function labelInHaze(p,name,color,bold){
    if(!p||p.length<2)return;
    for(const pt of p){
      if(pt.alt>2.5&&pt.alt<4.5){
        const lx=pX(pt.az),ly=pY(pt.alt);
        ctx.font=(bold?'bold ':'')+'10px Nunito, sans-serif';
        ctx.fillStyle=color;ctx.textAlign='right';
        ctx.fillText(name,lx-72,ly);
        return;
      }
    }
    // Fallback: label at first visible point
    for(const pt of p){
      const x=pX(pt.az),y=pY(pt.alt);
      if(x>20&&x<W-20&&y>20&&y<H-20){
        ctx.font=(bold?'bold ':'')+'10px Nunito, sans-serif';
        ctx.fillStyle=color;ctx.textAlign='right';
        ctx.fillText(name,x-72,y);
        return;
      }
    }
  }

  // Non-selected paths
  for(const k of['vernal','summer','autumnal','winter']){
    if(k===sel)continue;
    if(!eqSel&&(k==='vernal'||k==='autumnal'))continue;
    drawCP(aP[k],PC[k].d,1,[4,3]);
    if(k!=='vernal'&&k!=='autumnal')labelInHaze(aP[k],DL[k],PC[k].d,false);
  }
  // Merged equinox
  if(!eqSel){
    drawCP(aP['vernal'],'rgba(200,220,150,0.25)',1.5,[4,3]);
    labelInHaze(aP['vernal'],'Equinox','rgba(200,220,150,0.35)',false);
  }
  // Active path
  drawCP(aP[sel],PC[sel].b,2.5,[]);
  labelInHaze(aP[sel],DL[sel],PC[sel].b,true);

  // Sun BEFORE silhouette
  const sy=pY(sunAlt);
  if(sy>-20&&sy<H+20){
    const gs=sunAlt>-6?45:22,sga=Math.max(.05,Math.min(.6,(sunAlt+10)/16));
    const sg=ctx.createRadialGradient(sx,sy,0,sx,sy,gs);
    sg.addColorStop(0,`rgba(255,220,100,${sga})`);sg.addColorStop(.3,`rgba(255,160,50,${sga*.5})`);sg.addColorStop(1,'rgba(255,100,20,0)');
    ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sx,sy,gs,0,Math.PI*2);ctx.fill();
    const da=Math.max(.1,Math.min(1,(sunAlt+15)/21));
    ctx.fillStyle=sunAlt>0?`rgba(255,240,180,${da})`:sunAlt>-6?`rgba(255,180,80,${da})`:`rgba(255,120,50,${da})`;
    ctx.beginPath();ctx.arc(sx,sy,8,0,Math.PI*2);ctx.fill();
  }

  // Silhouette on top
  ctx.fillStyle='#000';ctx.beginPath();ctx.moveTo(0,HY+2);
  for(const s of sil)ctx.lineTo(s.x,HY-s.h+2);
  ctx.lineTo(W,HY+2);ctx.lineTo(W,HY+6);ctx.lineTo(0,HY+6);ctx.closePath();ctx.fill();

  // Angle bracket
  if(prevAV>0.1&&sunAlt<=0.1&&sunAlt>-0.5&&S.playing){
    abTime=performance.now();abAngle=pathAngle(S.lat,DECL[sel]);abPos={x:sx,y:HY};
    const lR=S.lat*D,dR=DECL[sel]*D;
    const ha_a=haAt(lR,dR,3),ha_b=haAt(lR,dR,0.5);
    if(ha_a&&ha_b){const ax=pX(sAz(lR,dR,ha_a)*RD),ay=pY(3),bx=pX(sAz(lR,dR,ha_b)*RD),by=pY(0.5);const dx=bx-ax,dy=by-ay,ln=Math.sqrt(dx*dx+dy*dy);abDir=ln>0?{x:dx/ln,y:dy/ln}:null;}else abDir=null;
  }
  if(abAngle!==null&&abPos!==null&&abDir!==null){
    const el=(ts-abTime)/1000;
    if(el<2.5){
      const al=el<2?1:Math.max(0,1-(el-2)/.5);
      const bx=abPos.x,by=abPos.y,arm=70;
      ctx.strokeStyle=`rgba(0,255,180,${al*.8})`;ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx,by-arm);ctx.stroke();
      const ux=-abDir.x,uy=-abDir.y;
      ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx+ux*arm,by+uy*arm);ctx.stroke();
      const vA=-Math.PI/2,cA=Math.atan2(uy,ux);
      ctx.strokeStyle=`rgba(0,255,180,${al*.6})`;ctx.lineWidth=1.5;
      let df=cA-vA;while(df>Math.PI)df-=2*Math.PI;while(df<-Math.PI)df+=2*Math.PI;
      if(df>0){ctx.beginPath();ctx.arc(bx,by,22,vA,vA+df);ctx.stroke();}
      else{ctx.beginPath();ctx.arc(bx,by,22,vA+df,vA);ctx.stroke();}
      ctx.font='bold 13px Orbitron, monospace';ctx.fillStyle=`rgba(0,255,180,${al})`;ctx.textAlign='left';
      ctx.fillText(abAngle.toFixed(1)+'°',bx+30,by-arm*.55);
    }else{abAngle=null;abPos=null;abDir=null;}
  }
  prevAV=sunAlt;

  // Compass
  const vp=VP[S.viewpoint];
  ctx.textAlign='center';
  const centerDir={'W':'W','NW':'NW','SW':'SW'}[S.viewpoint];
  for(const[az,lb]of vp.dirs){
    const x=pX(az);if(x<5||x>W-5)continue;
    const isC=lb===centerDir;
    ctx.font='11px Orbitron, monospace';
    ctx.fillStyle=isC?'rgba(255,255,255,0.65)':'rgba(255,255,255,0.3)';
    ctx.fillText(lb,x,HY+18);
    if(isC){ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1;const tw=ctx.measureText(lb).width;ctx.beginPath();ctx.moveTo(x-tw/2,HY+20);ctx.lineTo(x+tw/2,HY+20);ctx.stroke();}
  }
}

// Azimuth diagram
const azC=document.getElementById('azimuth-canvas'),azX=azC.getContext('2d');
const DC2={vernal:'#ffff66',summer:'#ff6666',autumnal:'#66ff66',winter:'#6699ff'};

function drawAzDiag(latD,sel){
  // Force full canvas clear by resetting dimensions
  const savedW=azC.width,savedH=azC.height;
  azC.width=savedW; // this resets the canvas state completely
  azX.clearRect(0,0,azC.width,azC.height);
  const cw=azC.width,ch=azC.height,cx=cw/2,cy=ch-14,Rd=58;
  azX.strokeStyle='rgba(255,255,255,0.2)';azX.lineWidth=1;
  azX.beginPath();azX.arc(cx,cy,Rd,Math.PI,0,false);azX.stroke();
  azX.font='9px Orbitron, monospace';azX.fillStyle='rgba(255,255,255,0.35)';azX.textAlign='center';
  azX.fillText('S',cx-Rd-10,cy+4);azX.fillText('N',cx+Rd+10,cy+4);

  const res={};
  const noRise={};
  for(const dk of['winter','vernal','summer','autumnal']){
    if(!sunRises(latD,DECL[dk])){
      // Sun doesn't rise — special case
      noRise[dk]=true;
      // Show indicator at 90° from W = due S
      const cA=Math.PI; // due S on semicircle
      const ll=Rd-4;
      const ex=cx+ll*Math.cos(cA),ey=cy-ll*Math.sin(cA);
      const isAct=dk===sel;
      azX.strokeStyle=isAct?DC2[dk]:DC2[dk]+'55';azX.lineWidth=isAct?2:1;azX.setLineDash([3,2]);
      azX.beginPath();azX.moveTo(cx,cy);azX.lineTo(ex,ey);azX.stroke();azX.setLineDash([]);
      azX.font='8px Nunito, sans-serif';azX.fillStyle=isAct?DC2[dk]:DC2[dk]+'88';azX.textAlign='center';
      azX.fillText(DSH[dk],ex-12,ey-2);
      res[dk]={az:180,off:-90,noRise:true};
      continue;
    }
    const az=sunsetAzD(latD,DECL[dk]);if(az===null)continue;
    const off=az-270;res[dk]={az,off};
    const cA=Math.PI/2-off*D;
    const eqSel2=sel==='vernal'||sel==='autumnal';
    const isEq=dk==='vernal'||dk==='autumnal';
    const isAct=dk===sel;const noEq=!eqSel2;
    if(isEq&&noEq&&dk==='autumnal')continue;
    const ll=isAct?Rd+8:Rd-4;
    const ex=cx+ll*Math.cos(cA),ey=cy-ll*Math.sin(cA);
    let lc,lw,ld;
    if(isAct){lc=DC2[dk];lw=2.5;ld=[];}
    else if(isEq&&noEq){lc='rgba(200,220,150,0.35)';lw=1.5;ld=[3,2];}
    else{lc=DC2[dk]+'55';lw=1.5;ld=[3,2];}
    azX.strokeStyle=lc;azX.lineWidth=lw;azX.setLineDash(ld);
    azX.beginPath();azX.moveTo(cx,cy);azX.lineTo(ex,ey);azX.stroke();azX.setLineDash([]);
    const tx=cx+(ll+12)*Math.cos(cA),ty=cy-(ll+12)*Math.sin(cA);
    azX.textAlign='center';
    // Clean labels: W when neither equinox selected, just AE or VE when selected
    if(isEq&&noEq){
      // Neither equinox selected — show W only
      azX.fillStyle='rgba(255,255,255,0.5)';azX.font='9px Orbitron, monospace';azX.fillText('W',tx,ty+2);
    }else if(isAct&&isEq){
      // This equinox selected — show just its name (AE or VE)
      azX.font='bold 9px Nunito, sans-serif';azX.fillStyle=DC2[dk];azX.fillText(DSH[dk],tx,ty+2);
    }else if(isEq&&!noEq&&!isAct){
      // Other equinox not selected — show nothing (no dim label)
    }else if(!isEq){
      azX.font=isAct?'bold 9px Nunito, sans-serif':'8px Nunito, sans-serif';azX.fillStyle=isAct?DC2[dk]:DC2[dk]+'88';azX.fillText(DSH[dk],tx,ty);
    }
  }
  azX.fillStyle='#fff';azX.beginPath();azX.arc(cx,cy,3,0,Math.PI*2);azX.fill();

  const inf=document.getElementById('az-info'),sr=res[sel];
  if(sr){
    if(sr.noRise){
      inf.innerHTML=`<b>${DL[sel]}</b><br>Sun does not rise.<br>Sunset angle ≈ 90° from W`;
    }else{
      const sign=sr.off>=0?'+':'−';const dir=sr.off>0.5?'N of W':sr.off<-0.5?'S of W':'≈ due W';
      inf.innerHTML=`<b>${DL[sel]}</b><br>Azimuth: ${sr.az.toFixed(1)}° (${sign}${Math.abs(sr.off).toFixed(1)}° ${dir})`;
    }
  }else inf.innerHTML=`<b>${DL[sel]}</b><br>Sun does not set.`;
}

// State
const S={year:2026,day:'vernal',lat:35,speed:480,playing:false,currentHA:0,haStart:0,haEnd:0,haSunset:null,haPhases:{},allPaths:{},segDur:{},lastFT:0,finished:false,city:CITIES[1]/*default*/,maxElapsed:null,viewpoint:'W',azBlankNeeded:false};

function fmtT(m){if(m===null||isNaN(m))return'──:──';const mm=Math.floor(m),ss=Math.round((m-mm)*60);return`${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;}

function applyVP(){const vp=VP[S.viewpoint];AZ0=vp.az0;AZ1=vp.az1;AZR=AZ1-AZ0;HY=pY(0);sil=genSil(W);}

function recalc(){
  const{lat,day}=S,dec=DECL[day],lR=lat*D,dR=dec*D;
  applyVP();
  S.haStart=haAt(lR,dR,6)||haAt(lR,dR,2)||haAt(lR,dR,0)||0.01;
  S.haSunset=haAt(lR,dR,0);
  let he=haAt(lR,dR,-20);S.haEnd=he||Math.PI+0.02;
  S.haPhases={civil:haAt(lR,dR,-6),nautical:haAt(lR,dR,-12),astro:haAt(lR,dR,-18)};
  S.allPaths={};for(const dk of['vernal','summer','autumnal','winter'])S.allPaths[dk]=mkPath(lat,DECL[dk]);
  const ct=t2alt(lat,dec,-6,day),nt=t2alt(lat,dec,-12,day),at2=t2alt(lat,dec,-18,day);
  if(ct!==null){
    // Normal case: sun sets
    S.segDur={civil:ct,nautical:nt!==null?nt-ct:null,astro:at2!==null&&nt!==null?at2-nt:null,total:at2};
  }else{
    // Sun never truly sets — compute segment durations between altitude thresholds directly
    const h6=haAt(lR,dR,-6),h12=haAt(lR,dR,-12),h18=haAt(lR,dR,-18);
    const nautDur=(h6!==null&&h12!==null)?((h12-h6)*RD/(15/ovf(DOY[day]))*60):null;
    const astrDur=(h12!==null&&h18!==null)?((h18-h12)*RD/(15/ovf(DOY[day]))*60):null;
    S.segDur={civil:null,nautical:nautDur,astro:astrDur,total:null};
  }
  S.maxElapsed=null;
  // For no-sunset cases, set haEnd to π (due N) — animate() due-N stop will handle early termination
  if(S.haSunset===null){
    S.haEnd=Math.PI+0.02;
  }
  // Update timer title
  document.getElementById('timer-title').textContent=S.haSunset?'Elapsed Time Since Sunset':'Elapsed Time';
  // Check if CP hits azimuth box for this day
  S.azBlankNeeded=cpHitsBox(S.allPaths,day);

  S.currentHA=S.haStart;S.finished=false;S.playing=false;prevAV=99;abAngle=null;abPos=null;abDir=null;
  document.getElementById('btn-play').textContent='▶ Play';
  positionAzCard();
  updTimers(0);drawAzDiag(lat,day);updInfoBox();
  // Show azimuth at full opacity until Play (don't blank yet)
  document.getElementById('card-azimuth').style.opacity='1';
  document.getElementById('card-timer').style.opacity='1';
  drawFrame(performance.now());
}

function updAzOp(){
  // Only blank during play or when finished, and only if CP hits box for selected day
  if(!S.playing&&!S.finished){document.getElementById('card-azimuth').style.opacity='1';return;}
  document.getElementById('card-azimuth').style.opacity=S.azBlankNeeded?'0.25':'1';
}
function updTimerOp(sunAz,sunAlt){
  // Dim timer if sun passes behind it (high lat, sun doesn't set)
  const sx=pX(sunAz),sy=pY(sunAlt);
  const overlaps=sx>W-260&&sy<200&&(S.playing||S.finished);
  document.getElementById('card-timer').style.opacity=overlaps?'0.25':'1';
}

function updInfoBox(){
  const c=S.city,ld=locDate(S.year,S.day,c);
  let t=`<b>${DL[S.day]}</b>\n${ld}, ${S.year} · ${S.lat.toFixed(1)}°N`;
  if(c.id!=='none'&&c.id!=='default'&&c.lon!==null)t+=`\n${c.name} (${fLon(c.lon)})`;
  else if(c.id==='default')t+='\nDefault · GMT/UTC';
  else t+='\nGMT/UTC';
  let dl='';for(const dk of['vernal','summer','autumnal','winter']){const d=locDate(S.year,dk,c);dl+=`${dk===S.day?'▸':'·'}${DSH[dk]}:${d} `;}
  document.getElementById('info-box').innerHTML=t+'\n'+dl;
}

function curAlt(){return sAlt(S.lat*D,DECL[S.day]*D,S.currentHA)*RD;}
function curAz(){return sAz(S.lat*D,DECL[S.day]*D,S.currentHA)*RD;}

function updTimers(eM){
  let dE=eM;
  document.getElementById('elapsed-clock').textContent=(S.haSunset&&S.currentHA>=S.haSunset)?fmtT(dE):(S.haSunset===null&&(S.playing||S.finished))?fmtT(dE):'00:00';
  const{segDur:sd,haPhases:hp}=S;
  const up=(id,ph,v)=>{const e=document.getElementById(id);if(v===null){e.textContent='N/A';e.classList.remove('filled');}else if(hp[ph]!==null&&S.currentHA>=hp[ph]){e.textContent=fmtT(v);e.classList.add('filled');}else{e.textContent=hp[ph]===null?'N/A':'──:──';e.classList.remove('filled');}};
  up('t-civil','civil',sd.civil);up('t-nautical','nautical',sd.nautical);up('t-astro','astro',sd.astro);
  const tt=document.getElementById('t-total');
  if(sd.total===null){tt.textContent='N/A';}
  else if(hp.astro!==null&&S.currentHA>=hp.astro)tt.textContent=fmtT(sd.total);else tt.textContent=hp.astro===null?'N/A':'──:──';
  const al=curAlt(),pe=document.getElementById('phase-label');
  if(al>0){pe.textContent='DAYLIGHT';pe.style.color='#ffdd44';}
  else if(al>-6){pe.textContent='CIVIL TWILIGHT';pe.style.color='#ff6b35';}
  else if(al>-12){pe.textContent='NAUTICAL TWILIGHT';pe.style.color='#3a86ff';}
  else if(al>-18){pe.textContent='ASTRONOMICAL TWILIGHT';pe.style.color='#8338ec';}
  else{pe.textContent='NIGHT';pe.style.color='#444466';}
  document.getElementById('alt-label').textContent=`${al>=0?'+':''}${al.toFixed(1)}°`;
}

function drawFrame(ts){
  const alt=curAlt(),az=curAz();
  drawSky(alt,az,S.allPaths,S.day,ts);
  let eM=0;
  if(S.haSunset&&S.currentHA>=S.haSunset){eM=(S.currentHA-S.haSunset)*RD/(15/ovf(DOY[S.day]))*60;}
  else if(S.haSunset===null&&(S.playing||S.finished)){
    // Sun doesn't set — elapsed from start of play
    eM=(S.currentHA-S.haStart)*RD/(15/ovf(DOY[S.day]))*60;
  }
  updTimers(eM);updTimerOp(az,alt);updAzOp();
}

function animate(ts){
  if(!S.playing)return;
  if(S.lastFT===0)S.lastFT=ts;const dt=(ts-S.lastFT)/1000;S.lastFT=ts;
  S.currentHA+=S.speed*dt/3600*15*D;
  let eM=0;
  if(S.haSunset&&S.currentHA>=S.haSunset){eM=(S.currentHA-S.haSunset)*RD/(15/ovf(DOY[S.day]))*60;}
  else if(S.haSunset===null){eM=(S.currentHA-S.haStart)*RD/(15/ovf(DOY[S.day]))*60;}
  const curAltNow=sAlt(S.lat*D,DECL[S.day]*D,S.currentHA)*RD;
  const curAzNow=sAz(S.lat*D,DECL[S.day]*D,S.currentHA)*RD;
  let stop=false;
  if(S.currentHA>=S.haEnd)stop=true;
  if(S.haSunset===null){
    // Check if sun never rises (WS-like) or never sets (SS-like)
    const transitAlt=sAlt(S.lat*D,DECL[S.day]*D,0)*RD;
    if(transitAlt<0){
      // Sun never rises — stop when altitude reaches -20°
      if(curAltNow<=-20)stop=true;
    }else{
      // Sun never sets — stop within 1° of due N
      if(curAzNow>=359)stop=true;
      if(curAzNow<90&&S.currentHA>S.haStart+10*D)stop=true;
    }
  }
  if(stop){if(S.currentHA>S.haEnd)S.currentHA=S.haEnd;S.playing=false;S.finished=true;document.getElementById('btn-play').textContent='▶ Play';}
  drawFrame(ts);if(S.playing)requestAnimationFrame(animate);
}

function resetToDefault(){
  S.city=CITIES[1];// Default
  S.lat=35;
  document.getElementById('sl-lat').value=35;
  document.getElementById('lat-display').textContent='35°N';

}

// Fullscreen toggle.
// Inside the slide-quiz the page is an iframe, and an iframe may only go truly
// fullscreen if its parent allows it. When the request is refused we fall back
// to filling the frame instead, so the button always does something visible and
// always has a way back. Either way it reads "Normal" while expanded.
const fsBtn=document.getElementById('btn-fs');
function fsExpanded(){return !!(document.fullscreenElement||document.body.classList.contains('maxed'));}
function fsLabel(){
  const on=fsExpanded();
  fsBtn.textContent=on?'\u2715 Normal':'\u26f6 Full';
  fsBtn.title=on?'Back to the normal size':'Fill the screen';
}
function fsFill(on){
  document.body.classList.toggle('maxed',on);
  fsLabel();resize();
}
fsBtn.addEventListener('click',()=>{
  if(document.fullscreenElement){document.exitFullscreen().catch(()=>{});return;}
  if(document.body.classList.contains('maxed')){fsFill(false);return;}
  let p=null;
  try{p=document.documentElement.requestFullscreen();}catch(e){p=null;}
  if(p&&p.then)p.then(fsLabel,()=>fsFill(true));
  else if(!document.fullscreenElement)fsFill(true);
});
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement&&document.body.classList.contains('maxed'))document.body.classList.remove('maxed');
  fsLabel();resize();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('maxed'))fsFill(false);});
fsLabel();

window.addEventListener('resize',resize);
resize();recalc();

/* ============================ recorder ============================
   Records the pass to a 1920x1080 file. The sky is canvas, but the timer card,
   the azimuth card and the two labels are HTML sitting on top of it, so a plain
   captureStream on the sky canvas would lose exactly the panels the narration
   points at. Instead the sky canvas is switched to 1920x1080 for the duration,
   each frame is copied into an offscreen canvas, and the cards are redrawn there
   from the live DOM values — so what is recorded is what is on screen.

   Frames are stepped deterministically from haStart to the pass's natural end,
   so the recording is the same every time and independent of the speed control.
   MP4 output is remuxed to a progressive file before download; see fmp4.js. */

const RW=1920,RH=1080;
const recCv=document.createElement('canvas');recCv.width=RW;recCv.height=RH;
const rx=recCv.getContext('2d');
const REC={on:false,fps:30,dur:20,hold:1.2,total:0,frame:0,pre:0,post:0,acc:0,last:0,
           track:null,mime:null,ext:'webm',endHA:0,saved:null,rec:null,chunks:[]};

const RFORMATS=[
  {ext:'mp4', label:'MP4 (H.264)', mimes:['video/mp4;codecs=avc1.42E01E','video/mp4;codecs=avc1.4D401F',
                                          'video/mp4;codecs=avc1.64001F','video/mp4;codecs=avc1',
                                          'video/mp4;codecs=h264','video/mp4']},
  {ext:'mkv', label:'MKV (H.264)', mimes:['video/x-matroska;codecs=avc1','video/x-matroska;codecs=h264']},
  {ext:'webm',label:'WebM (VP9)',  mimes:['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm']}
];
const RAVAIL=[];let rFmtIdx=0;
(function(){
  if(typeof MediaRecorder==='undefined')return;
  for(const f of RFORMATS)for(const mm of f.mimes){
    let ok=false;try{ok=MediaRecorder.isTypeSupported(mm);}catch(e){}
    if(ok){RAVAIL.push({ext:f.ext,label:f.label,mime:mm});break;}
  }
})();
function recExt(){return RAVAIL.length?RAVAIL[rFmtIdx].ext:'webm';}
function recStatus(t){document.getElementById('rec-note').textContent=t;}
function recFormatUI(){
  const b=document.getElementById('btn-fmt');
  if(!RAVAIL.length){b.textContent='Format: none';recStatus('this browser cannot record the canvas');return;}
  b.textContent='Format: '+RAVAIL[rFmtIdx].label;
  recStatus('saves a .'+recExt()+' of one full pass'+(RAVAIL.length>1?' · click Format to cycle':''));
}

/* where the pass actually ends — the same stop rules animate() uses */
function recEndHA(){
  const lR=S.lat*D,dR=DECL[S.day]*D;
  if(S.haSunset!==null)return S.haEnd;
  const transitAlt=sAlt(lR,dR,0)*RD,step=0.05*D;
  let ha=S.haStart;
  for(let i=0;i<40000;i++){
    ha+=step;
    if(ha>=S.haEnd)return S.haEnd;
    const alt=sAlt(lR,dR,ha)*RD,az=sAz(lR,dR,ha)*RD;
    if(transitAlt<0){if(alt<=-20)return ha;}
    else{if(az>=359)return ha;if(az<90&&ha>S.haStart+10*D)return ha;}
  }
  return S.haEnd;
}

/* ---------- compositing ---------- */
function rRound(c,x,y,w,h,r){
  c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();
}
function rCard(x,y,w,h){
  rx.fillStyle='rgba(13,13,36,0.92)';rRound(rx,x,y,w,h,14);rx.fill();
  rx.strokeStyle='#1a1a3a';rx.lineWidth=2;rRound(rx,x,y,w,h,14);rx.stroke();
}
function rChip(txt,x,y,color,size){
  rx.font=size+'px "Orbitron","Courier New",monospace';
  const w=rx.measureText(txt).width+26,h=size+20;
  rx.fillStyle='rgba(0,0,0,0.65)';rRound(rx,x,y,w,h,8);rx.fill();
  rx.strokeStyle='#1a1a3a';rx.lineWidth=2;rRound(rx,x,y,w,h,8);rx.stroke();
  rx.fillStyle=color;rx.textAlign='left';rx.textBaseline='middle';
  rx.fillText(txt,x+13,y+h/2+1);
  return w;
}
function rText(id){const e=document.getElementById(id);return e?e.textContent:'';}
function rOpacity(id){
  const e=document.getElementById(id);
  const v=e&&e.style&&e.style.opacity!==''?parseFloat(e.style.opacity):1;
  return isNaN(v)?1:v;
}
function rSegRow(x,y,w,dotColor,label,value,filled){
  if(dotColor){rx.fillStyle=dotColor;rx.beginPath();rx.arc(x+7,y+11,7,0,Math.PI*2);rx.fill();}
  rx.fillStyle='#c8c8e0';rx.textAlign='left';rx.textBaseline='middle';
  rx.font='24px "Nunito","Segoe UI",sans-serif';
  rx.fillText(label,x+(dotColor?24:0),y+12);
  rx.font='600 25px "Orbitron","Courier New",monospace';
  rx.fillStyle=filled?'#ffffff':'#6868a0';
  rx.textAlign='right';rx.fillText(value,x+w,y+12);
  rx.textAlign='left';
  rx.strokeStyle='rgba(255,255,255,0.05)';rx.lineWidth=1;
  rx.beginPath();rx.moveTo(x,y+26.5);rx.lineTo(x+w,y+26.5);rx.stroke();
}
function rAzLines(){
  const el=document.getElementById('az-info');
  if(!el)return[];
  return el.innerHTML.split(/<br\s*\/?>/i).map(s=>s.replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').trim()).filter(Boolean);
}
function recComposite(){
  rx.globalAlpha=1;
  rx.fillStyle='#000';rx.fillRect(0,0,RW,RH);
  rx.drawImage(skyC,0,0,RW,RH);

  // labels, top left
  const al=curAlt();
  let pc='#444466',pt='NIGHT';
  if(al>0){pt='DAYLIGHT';pc='#ffdd44';}
  else if(al>-6){pt='CIVIL TWILIGHT';pc='#ff6b35';}
  else if(al>-12){pt='NAUTICAL TWILIGHT';pc='#3a86ff';}
  else if(al>-18){pt='ASTRONOMICAL TWILIGHT';pc='#8338ec';}
  const wLab=rChip(pt,26,26,pc,26);
  rChip(rText('alt-label'),26+wLab+14,26,'#ff8c42',24);

  // cards, top right
  const cw=470,cx=RW-cw-26;let cy=26;
  rx.globalAlpha=rOpacity('card-timer');
  const th=300;
  rCard(cx,cy,cw,th);
  const px0=cx+22,iw=cw-44;
  rx.fillStyle='#6868a0';rx.textAlign='left';rx.textBaseline='middle';
  rx.font='20px "Orbitron","Courier New",monospace';
  rx.fillText(rText('timer-title').toUpperCase(),px0,cy+24);
  rx.font='700 62px "Orbitron","Courier New",monospace';
  rx.fillStyle='#ff8c42';rx.textAlign='center';
  rx.fillText(rText('elapsed-clock'),cx+cw/2,cy+86);
  rx.textAlign='left';
  let ry=cy+130;
  const filled=id=>{const e=document.getElementById(id);return!!(e&&e.classList&&e.classList.contains('filled'));};
  rSegRow(px0,ry,iw,'#ff6b35','Civil (0°→−6°)',rText('t-civil'),filled('t-civil'));ry+=40;
  rSegRow(px0,ry,iw,'#3a86ff','Nautical (−6°→−12°)',rText('t-nautical'),filled('t-nautical'));ry+=40;
  rSegRow(px0,ry,iw,'#8338ec','Astro (−12°→−18°)',rText('t-astro'),filled('t-astro'));ry+=40;
  rx.fillStyle='#c8c8e0';rx.font='700 24px "Nunito","Segoe UI",sans-serif';
  rx.fillText('Total (0°→−18°)',px0,ry+12);
  rx.font='600 26px "Orbitron","Courier New",monospace';rx.fillStyle='#ff8c42';rx.textAlign='right';
  rx.fillText(rText('t-total'),px0+iw,ry+12);rx.textAlign='left';

  cy+=th+14;
  rx.globalAlpha=rOpacity('card-azimuth');
  const lines=rAzLines();
  const azW=iw,azH=Math.round(azW*(azC.height/Math.max(1,azC.width)));
  const ch=34+azH+10+lines.length*26+24;
  rCard(cx,cy,cw,ch);
  rx.fillStyle='#6868a0';rx.font='20px "Orbitron","Courier New",monospace';
  rx.fillText('SUNSET AZIMUTH DIAGRAM',px0,cy+24);
  rx.drawImage(azC,px0,cy+38,azW,azH);
  rx.fillStyle='#6868a0';rx.font='22px "Nunito","Segoe UI",sans-serif';
  let ly=cy+38+azH+22;
  for(let i=0;i<lines.length;i++){
    rx.fillStyle=i===0?'#c8c8e0':'#6868a0';
    rx.fillText(lines[i],px0,ly);ly+=26;
  }
  rx.globalAlpha=1;

  // credit line, bottom right
  rx.font='20px "Nunito","Segoe UI",sans-serif';rx.fillStyle='rgba(200,200,224,0.55)';
  rx.textAlign='right';rx.fillText('© 2026 Magellica Press · R. Mahoney',RW-26,RH-26);
  rx.textAlign='left';
}

/* ---------- run ---------- */
function recStop(){
  if(REC.rec&&REC.rec.state!=='inactive')REC.rec.stop();
  REC.on=false;REC.track=null;
  const b=document.getElementById('btn-rec');
  b.classList.remove('live');b.textContent='⏺ Record';
  // put the canvas and the state back
  if(REC.saved){skyC.width=REC.saved.cw;skyC.height=REC.saved.ch;REC.saved=null;}
  resize();recalc();
}
function recTick(ts){
  if(!REC.on)return;
  if(!REC.last)REC.last=ts;
  const dt=Math.min(0.25,(ts-REC.last)/1000);REC.last=ts;
  const iv=1/REC.fps;REC.acc+=dt;
  let emit=false,done=false;
  if(REC.acc>=iv){
    REC.acc-=iv;if(REC.acc>iv)REC.acc=0;emit=true;
    if(REC.pre>0)REC.pre--;
    else if(REC.frame<REC.total){
      REC.frame++;
      S.currentHA=S.haStart+(REC.endHA-S.haStart)*(REC.frame/REC.total);
    }
    else if(REC.post>0){REC.post--;if(REC.post===0)done=true;}
  }
  if(emit){
    drawFrame(ts);
    recComposite();
    if(REC.track&&REC.track.requestFrame)REC.track.requestFrame();
    if(REC.frame%10===0)recStatus('recording — frame '+REC.frame+' of '+REC.total);
  }
  if(done){recStop();return;}
  requestAnimationFrame(recTick);
}
function recSave(){
  const blob=new Blob(REC.chunks,{type:REC.mime});
  if(!blob.size){recStatus('no data recorded — try a different Format');return;}
  const stamp='Twilight_'+S.day+'_'+Math.round(S.lat)+'N_'+S.viewpoint+'_'+REC.dur+'s_'+REC.fps+'fps.'+REC.ext;
  const give=bytes=>{
    const out=new Blob([bytes],{type:REC.mime});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(out);a.download=stamp;a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),8000);
    recStatus('saved '+stamp);
  };
  if(REC.ext==='mp4'&&typeof fmp4ToProgressiveMp4==='function'&&blob.arrayBuffer){
    recStatus('rebuilding the MP4 index so Camtasia reads the full length…');
    blob.arrayBuffer().then(buf=>{
      let fixed;
      try{fixed=fmp4ToProgressiveMp4(new Uint8Array(buf),{fps:REC.fps});}
      catch(e){fixed=new Uint8Array(buf);}
      give(fixed);
    }).catch(()=>give(blob));
  }else give(blob);
}
document.getElementById('btn-rec').addEventListener('click',()=>{
  if(REC.on){recStop();return;}
  if(!recCv.captureStream||typeof MediaRecorder==='undefined'||!RAVAIL.length){
    recStatus('this browser cannot record the canvas — screen-record instead');return;
  }
  REC.fps=+document.getElementById('sel-fps').value;
  REC.dur=+document.getElementById('sel-dur').value;

  // try the chosen format first, manual frame stepping before automatic capture
  const order=RAVAIL.slice(rFmtIdx).concat(RAVAIL.slice(0,rFmtIdx));
  let started=null,lastErr=null;
  for(let t=0;t<order.length&&!started;t++){
    for(let manual=1;manual>=0&&!started;manual--){
      let stream=null;REC.track=null;
      try{
        if(manual){
          stream=recCv.captureStream(0);
          REC.track=stream.getVideoTracks()[0];
          if(!REC.track||!REC.track.requestFrame){REC.track=null;continue;}
        }else stream=recCv.captureStream(REC.fps);
        const r=new MediaRecorder(stream,{mimeType:order[t].mime,
                  videoBitsPerSecond:REC.fps>=60?24000000:16000000});
        r.start();
        started={r:r,fmt:order[t],manual:!!manual};
      }catch(err){lastErr=err;REC.track=null;}
    }
  }
  if(!started){recStatus('could not start the recorder'+(lastErr?' ('+(lastErr.name||lastErr)+')':''));return;}

  REC.rec=started.r;REC.mime=started.fmt.mime;REC.ext=started.fmt.ext;REC.chunks=[];
  REC.rec.ondataavailable=e=>{if(e.data&&e.data.size)REC.chunks.push(e.data);};
  REC.rec.onerror=ev=>recStatus('recorder error: '+((ev&&ev.error&&ev.error.name)||'unknown'));
  REC.rec.onstop=recSave;

  // freeze playback and switch the sky canvas to the recording size
  S.playing=false;document.getElementById('btn-play').textContent='▶ Play';
  REC.saved={cw:skyC.width,ch:skyC.height};
  skyC.width=RW;skyC.height=RH;W=RW;H=RH;HY=pY(0);sil=genSil(W);
  S.currentHA=S.haStart;S.finished=false;prevAV=99;abAngle=null;abPos=null;abDir=null;
  S.playing=true;                              // so the panels dim exactly as they do in play
  REC.endHA=recEndHA();
  REC.total=Math.round(REC.fps*REC.dur);REC.frame=0;REC.acc=0;REC.last=0;
  REC.pre=Math.round(REC.fps*0.4);REC.post=Math.max(1,Math.round(REC.fps*REC.hold));
  REC.on=true;
  const b=document.getElementById('btn-rec');
  b.classList.add('live');b.textContent='⏹ Stop';
  recStatus('recording — '+started.fmt.label+(started.manual?'':' (auto capture)'));
  requestAnimationFrame(recTick);
});
document.getElementById('btn-fmt').addEventListener('click',()=>{
  if(REC.on||RAVAIL.length<2)return;
  rFmtIdx=(rFmtIdx+1)%RAVAIL.length;recFormatUI();
});
recFormatUI();

</script>
